services:
  - type: web
    name: loci-brand-distinctiveness-demo
    runtime: python
    plan: free          # free tier — spins down after 15 min inactivity
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ALLOWED_ORIGINS
        value: ""
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_CALL_BUDGET
        value: "200"
      # Shared with the frontend build (VITE_CLIENT_KEY) — filters bots/scanners
      # that hit this API directly without loading the page. Not treated as a
      # real secret (it ships in the public JS bundle), just not committed.
      - key: CLIENT_KEY
        sync: false
      # Set to "true" via the Render dashboard to 503 every route except the
      # health check, without a redeploy.
      - key: MAINTENANCE_MODE
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DAILY_IP_CAP_SCORE
        value: "300"
      - key: DAILY_VISITOR_CAP_SCORE
        value: "150"
    # No autoscaling / numInstances block on purpose: this app keeps brand
    # state, job status, and rate limits in per-process memory (see api.py),
    # so it must stay a single instance, single worker.
